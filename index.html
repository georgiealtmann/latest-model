<title>Latest-Generation Golf</title>

<style>
/* Layout: a 16:9 film player centred on a dark ground, transport controls underneath. Single deliberate dark look. */
:root {
  color-scheme: dark;
  --ground: #121418; --panel: #1d2128; --cream: #f3ead8; --sand: #d9b77e; --navy: #2c3e5c; --muted: #9aa0a8;
  --ui: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--cream); font-family: var(--ui); padding-inline: 16px; overflow: hidden; }
.wrap { height: 100%; max-width: 1500px; margin: 0 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; padding-block: 12px; }
.player { position: relative; width: min(100%, calc((100dvh - 100px) * 16 / 9)); aspect-ratio: 16 / 9; flex: none; background: #000; border-radius: 10px; overflow: hidden; container-type: inline-size; box-shadow: 0 20px 60px -20px #000; }
.player svg { display: block; width: 100%; height: 100%; }
.subs { position: absolute; left: 8%; right: 8%; bottom: 5.5%; text-align: center; pointer-events: none; font-weight: 600; font-size: clamp(13px, 2.9cqw, 40px); line-height: 1.25; color: #fff; text-shadow: 0 0 .18em #000, 0 0 .18em #000, 0 .06em .1em #000; }
.subs span { background: #0000006b; padding: .08em .45em .12em; border-radius: .3em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.subs[hidden] { display: none; }
.hint { position: absolute; left: 50%; top: 5%; transform: translateX(-50%); background: #ff5a8a; color: #fff; font-weight: 700; font-size: clamp(13px, 2.2cqw, 28px); padding: .3em .9em; border-radius: 999px; border: 3px solid #2a211d; pointer-events: none; white-space: nowrap; }
.hint[hidden] { display: none; }
.player { touch-action: none; }
.ask { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; }
.ask[hidden] { display: none; }
.ask button { position: absolute; top: 40%; font: 700 clamp(16px, 3.2cqw, 40px) var(--ui); padding: .35em 1.3em; border-radius: 999px; border: 3px solid #2a211d; box-shadow: 0 .12em 0 #2a211d; cursor: pointer; }
.ask .yes { left: 26%; background: #2c3e5c; color: #fff; transform: scale(var(--s, 1)); transition: transform .3s cubic-bezier(.3,1.6,.5,1); z-index: 2; }
.ask .no { left: 60%; background: #fff; color: #2a211d; transition: left .22s cubic-bezier(.3,1.4,.5,1), top .22s cubic-bezier(.3,1.4,.5,1), transform .22s; }
.ask .yes.wait { opacity: .55; pointer-events: none; }
.ask .no.wiggle { animation: wig .45s ease-in-out 3; }
@keyframes wig { 25% { rotate: -8deg; scale: 1.12; } 75% { rotate: 8deg; scale: 1.12; } }
.ask .tease { position: absolute; left: 8px; right: 8px; top: 0; text-align: center; font-weight: 700; font-size: clamp(14px, 2.6cqw, 32px); color: #2a211d; pointer-events: none; }
.cover { position: absolute; inset: 0; display: grid; place-items: center; background: #000a; cursor: pointer; border: 0; padding: 0; color: #fff; font: inherit; }
.cover[hidden] { display: none; }
.cover .inner { display: grid; justify-items: center; gap: .6em; font-size: clamp(14px, 2.4cqw, 30px); }
.cover .disc { width: 3.6em; height: 3.6em; border-radius: 50%; background: var(--cream); display: grid; place-items: center; box-shadow: 0 .2em 1em #0008; }
.cover .disc::after { content: ""; border-left: 1.2em solid var(--navy); border-top: .72em solid transparent; border-bottom: .72em solid transparent; margin-left: .3em; }
.cover b { font-weight: 600; letter-spacing: .02em; }
.cover small { color: var(--muted); font-size: .7em; }
.bar { width: min(100%, calc((100dvh - 100px) * 16 / 9)); display: flex; align-items: center; gap: 12px; }
.bar button { flex: none; height: 38px; min-width: 38px; padding: 0 12px; border-radius: 19px; border: 1px solid #ffffff22; background: var(--panel); color: var(--cream); font: 600 14px var(--ui); cursor: pointer; }
.bar button:hover { background: #262b34; }
.bar button:focus-visible, .bar input:focus-visible { outline: 2px solid var(--sand); outline-offset: 2px; }
.bar button[aria-pressed="true"] { background: var(--sand); color: #1d2128; border-color: var(--sand); }
#scrub { flex: 1; min-width: 0; accent-color: var(--sand); }
#clock { flex: none; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); width: 90px; text-align: right; }
#chap { flex: none; font-size: 13px; color: var(--muted); }
.fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
@media (max-width: 620px) { #clock, #chap { display: none; } .bar { gap: 8px; } }
</style>
</head>

<div class="wrap">
  <div class="player" id="player">
    <svg id="svg" viewBox="0 0 1920 1080" role="img" aria-label="Latest-Generation Golf, an animated short in seven scenes"></svg>
    <div class="subs" id="subs" aria-live="polite"></div>
    <div class="hint" id="hint" hidden></div>
    <div class="ask" id="ask" hidden><div class="tease" id="tease" aria-live="polite"></div><button class="yes" id="yes">Yes</button><button class="no" id="no">No</button></div>
    <button class="cover" id="cover" aria-label="Play the film"><span class="inner"><span class="disc"></span><b>Latest-Generation Golf</b><small>About 3 minutes · tap, swipe and answer when asked · sound on</small></span></button>
  </div>
  <div class="bar">
    <button id="play" aria-label="Play">▶</button>
    <button id="restart" aria-label="Restart">↺</button>
    <input id="scrub" type="range" min="0" max="330" step="0.01" value="0" aria-label="Position in film">
    <span id="clock">0:00 / 0:00</span>
    <span id="chap"></span>
    <button id="cc" aria-pressed="true" aria-label="Subtitles">CC</button>
    <button id="snd" aria-pressed="true" aria-label="Sound">♪</button>
  </div>
</div>

  if (o.glasses === 'silver') glasses = `

  const lw = r * .08;
  const mouths = {
    smile: `<path d="M${-r*.25} ${m} Q0 ${m + r*.2} ${r*.25} ${m}" style="fill:none;stroke:${INK};stroke-width:${lw};stroke-linecap:round"/>`,

    return `<g transform="translate(${x} ${hip - 4})"><g class="leg${side}" transform="translate(0 0) rotate(0)"><rect x="${-legW/2}" y="0" width="${legW}" height="${legLen}" rx="${legW*.4}" style="fill:${o.trousers}" ${S}/><ellipse cx="${side === 'L' ? -legW*.12 : legW*.12}" cy="${legLen}" rx="${legW*.85}" ry="${r*.28}" style="fill:${o.shoes}" ${S}/></g></g>`;

}

let ac = null, soundOn = true, master, musicBus, sfxBus, verb;
function actx() {
  if (ac) return ac;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = .9; master.connect(ac.destination);
  musicBus = ac.createGain(); musicBus.gain.value = .55;
  sfxBus = ac.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
  // small room reverb from generated impulse
  verb = ac.createConvolver();
  const len = ac.sampleRate * 2.6, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
  verb.buffer = ir;
  const wet = ac.createGain(); wet.gain.value = .32; const dry = ac.createGain(); dry.gain.value = .8;
  musicBus.connect(dry).connect(master); musicBus.connect(verb); verb.connect(wet).connect(master);
  return ac;
}
const now = () => (ac ? ac.currentTime : 0);
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

function piano(midi, at, vel = .5, len = 2.2) {
  if (!soundOn || !ac) return;

  const g = ac.createGain(), lp = ac.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 1400 + vel * 2600 - Math.max(0, midi - 72) * 20;
  const decay = Math.max(.6, len * (1.25 - (midi - 48) / 70));
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.16 * vel, t + .012);
  g.gain.exponentialRampToValueAtTime(.06 * vel, t + .25); g.gain.exponentialRampToValueAtTime(.0001, t + decay);
  [[1, 1], [2, .42], [3, .18], [4, .09], [5.02, .04]].forEach(([h, a], i) => {
    const o = ac.createOscillator(), og = ac.createGain();
    o.type = i ? 'sine' : 'triangle'; o.frequency.value = f * h * (1 + (i ? .0008 * i : 0)); og.gain.value = a;
    o.connect(og).connect(lp); o.start(t); o.stop(t + decay + .05);

const askEl = document.getElementById('ask'), yesB = document.getElementById('yes'), noB = document.getElementById('no'), teaseEl = document.getElementById('tease');
const TEASES = ['Nein.', 'DENIED', 'Can we go back to WhatsApp?', 'Georgie doesn’t respond well to threats', 'Absolutely not', 'Chances of this button working are almost 0'];
let dodges = 0;
let askReady = 0;
function startAsk() {
  waiting = 'ask'; dodges = 0; teaseEl.textContent = ''; askEl.hidden = false;
  yesB.style.setProperty('--s', 1); noB.style.left = '58%'; noB.style.top = '40%'; noB.style.transform = '';

  setTimeout(() => { yesB.classList.remove('wait'); noB.classList.remove('wiggle'); }, 1800);
}
function dodge(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  if (Date.now() < askReady && !e) return;
  dodges++; SFX.pop();
  const W = askEl.clientWidth, H = askEl.clientHeight, nw = noB.offsetWidth, nh = noB.offsetHeight;
  const a = askEl.getBoundingClientRect(), y = yesB.getBoundingClientRect();
  let x, t, tries = 0;
  do { x = Math.random() * (W - nw); t = Math.random() * (H - nh); tries++; }
  while (tries < 40 && x < y.right - a.left + 12 && x + nw > y.left - a.left - 12 && t < y.bottom - a.top + 12 && t + nh > y.top - a.top - 12);
  noB.style.left = x + 'px'; noB.style.top = t + 'px';
  noB.style.transform = `scale(${Math.max(.55, 1 - dodges * .06)}) rotate(${(Math.random() - .5) * 24}deg)`;
  yesB.style.setProperty('--s', Math.min(1.8, 1 + dodges * .1));
  teaseEl.textContent = TEASES[(dodges - 1) % TEASES.length];
}
noB.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') dodge(); });
noB.addEventListener('pointerdown', dodge);
noB.addEventListener('click', dodge);
askEl.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const r = noB.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;

yesB.addEventListener('click', e => { e.stopPropagation(); if (Date.now() < askReady) return; askEl.hidden = true; wipedAt = Date.now(); SFX.ding(); waiting = null; try { actx().resume(); } catch (x) {} tl.play(); setPlaying(true); });
function play() { try { actx().resume(); } catch (e) {} cover.hidden = true; if (tl.progress() >= 1) tl.time(0, true); tl.play(); setPlaying(true); }

  cover.onclick = play;

  document.getElementById('restart').onclick = () => { tl.time(0, true); play(); };

  scrub.addEventListener('input', () => { tl.time(+scrub.value, true); tick(); });

  const cc = document.getElementById('cc'), snd = document.getElementById('snd');
  cc.onclick = () => { const on = cc.getAttribute('aria-pressed') !== 'true'; cc.setAttribute('aria-pressed', on); subsEl.hidden = !on; };

  });

}
